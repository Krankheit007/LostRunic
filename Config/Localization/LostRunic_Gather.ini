[CommonSettings]
SourcePath=Content/Localization/LostRunic
DestinationPath=Content/Localization/LostRunic
ManifestName=LostRunic.manifest
ArchiveName=LostRunic.archive
PortableObjectName=LostRunic.po
NativeCulture=zh-Hans
CulturesToGenerate=zh-Hans
CulturesToGenerate=en
CulturesToGenerate=ja

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/LostRunic/
SearchDirectoryPaths=Source/LostRunicEditor/
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=true

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/LostRunic/Dialogue/*
IncludePathFilters=Content/LostRunic/UI/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldGatherFromEditorOnlyData=true

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true
